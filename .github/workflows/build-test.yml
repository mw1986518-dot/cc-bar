name: Build (test)

# 本地无 Xcode 时的云编译通道：推送到 kimi-mimo 分支或手动触发都会构建，
# 产物以 Actions artifact 上传（不打 tag、不发 Release）。
on:
  workflow_dispatch:
  push:
    branches: ['kimi-mimo']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择最新 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 构建并打包(ad-hoc 签名,无需证书)
        run: ./scripts/build.sh

      - name: 单元测试
        run: |
          xcodebuild \
            -project ccbar.xcodeproj \
            -scheme ccbar \
            -configuration Debug \
            -derivedDataPath build-tests \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            test

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CCBar-kimi-mimo
          path: |
            dist/CCBar.dmg
            dist/CCBar.app.zip
          if-no-files-found: error
